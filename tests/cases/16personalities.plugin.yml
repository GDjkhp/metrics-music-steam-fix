- name: 🧠 16personalities - MBTI Personality profile
  uses: lowlighter/metrics@latest
  with:
    token: MOCKED_TOKEN
    plugin_16personalities: 'yes'
    plugin_16personalities_url: https://www.16personalities.com/profiles/b7d9f29453ea5
    plugin_16personalities_sections: personality, traits
    plugin_16personalities_scores: 'no'
    use_mocked_data: 'yes'
    verify: 'yes'
  # Disabled: scrapes the live 16personalities.com site (not mocked), whose markup no longer matches the plugin's selectors.
  # Re-enable (remove `modes`) once the plugin selectors are updated.
  modes:
    - disabled